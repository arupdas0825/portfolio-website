# ──────────────────────────────────────────────────────────────────────────────
# SETUP STEPS:
# 1. Sign up at https://wakatime.com and install the WakaTime plugin in your IDE
# 2. Get your API key from https://wakatime.com/settings/api-key
# 3. Go to your GitHub repo Settings → Secrets → Actions
# 4. Add secret: WAKATIME_API_KEY = <your api key>
# 5. Add this to your README where you want the stats to appear:
#
#    <!--START_SECTION:waka-->
#    <!--END_SECTION:waka-->
#
# ──────────────────────────────────────────────────────────────────────────────

name: WakaTime Stats

on:
  schedule:
    - cron: "30 18 * * *"   # Runs daily at midnight IST (18:30 UTC)
  workflow_dispatch:          # Allows manual trigger from Actions tab

jobs:
  update-readme:
    name: Update WakaTime Stats in README
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "True"
          COMMIT_MESSAGE: "📊 Update WakaTime stats"
